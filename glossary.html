<script type="text/babel">

    let questionsnumber = 0;
    let correctanswers = 0;

    let datajson = []
    let originaldatajson = [];

    const root = ReactDOM.createRoot(
        document.getElementById('root')
    );

    init();

    function showData(datatoshow) {
        let elements = [];
        datatoshow.forEach((datum, index) => {
            const element = (
                <section className="glossaryitem" key={index}>
                    <div className="box">
                        <h3>{datum.term}</h3>
                        <p>
                            {datum.definition} <a href={datum.source}>[*]</a>
                        </p>
                    </div>
                </section>
            );

            elements.push(element);
        });

        root.render(elements);
    }

    function handleChange(event) {
        const keyword = event.target.value;

        var trimmedKeyword = keyword.toString().trim().toLowerCase();

        if (trimmedKeyword === "") {
            showData(datajson);
            return;
        }

        let newlistjson = [];

        Object.entries(datajson).forEach(([key, value]) => {
            if (value.term.trim().toLowerCase().includes(trimmedKeyword))
                newlistjson.push(value);
            else if (value.definition.trim().toLowerCase().includes(trimmedKeyword))
                newlistjson.push(value);
        });

        showData(newlistjson);
    }


    function showOnly(event) {
        datajson = [...originaldatajson];

        let val = event.target.value;
        let datatoshow = [];
        if (val === "0") {
            showData(originaldatajson);
            return;
        }

        Object.entries(datajson).forEach(([key, value]) => {
            if (value.chapter === val)
                datatoshow.push(value);
        });

        const nodestexts = document.getElementsByClassName("texts");

        for (let i = 0; i < nodestexts.length; i++) {
            nodestexts[i].childNodes.forEach(node => node.textContent = "");
        }

        const nodes = document.getElementsByClassName("ansbtn");

        for (let i = 0; i < nodes.length; i++) {
            nodes[i].disabled = false;
        }


        datajson = [];
        datajson = [...datatoshow];
        showData(datatoshow);
    }

    async function init() {
        datajson = await getData();
        originaldatajson = datajson;
        showData(datajson);
    }

    async function getData() {
        return await fetch('./terms.json')
            .then(response => response.json())
            .then(data => data)
            .catch(error => console.log(error));
    }
</script>

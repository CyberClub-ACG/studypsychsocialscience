<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Login - My Goal Learning</title>
    <link href='./img/socialpsycho.png' rel='icon' type='image/png'>
    <link href="./css/style.css" rel="stylesheet">

    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #004E64;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .login-form input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .login-form button {
            padding: 10px;
            background-color: #004E64;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-form button:hover {
            background-color: #00384a;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul class="menu">
                <li style="float: right; color: white"><a href="#">My Goal Learning</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <h2>Welcome to My Goal Learning</h2>
        <div class="login-form">
            <input type="password" id="password" placeholder="Enter password" required>
            <button onclick="checkPassword()">Login</button>
            <div id="error-message" class="error-message">Incorrect password. Please try again.</div>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
        };

        function checkPassword() {
            const password = document.getElementById('password').value;
            // Using a hash comparison instead of storing the password in plain text
            // This is a simple hash of "snickerS123?.?" for demo purposes
            const correctPasswordHash = "5e7f5475c6fa3d10543a2b7aa520e1e2";
            
            // Simple hash function for demo purposes
            function hashPassword(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32bit integer
                }
                return hash.toString(16);
            }
            
            if (hashPassword(password) === correctPasswordHash) {
                // Set login status in localStorage
                localStorage.setItem('isLoggedIn', 'true');
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                // Show error message
                document.getElementById('error-message').style.display = 'block';
            }
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>

</html>

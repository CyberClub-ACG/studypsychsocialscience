<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="../libs/http_unpkg.com_@babel_standalone_babel.js"></script>
    <script src="../libs/http_unpkg.com_react@18_umd_react.development.js"></script>
    <script src="../libs/http_unpkg.com_react-dom@18_umd_react-dom.development.js"></script>
    <title>Fill in the blanks - Psychology</title>
    <link href='../img/Psychology_favicon.png' rel='icon' type='image/png'>
    <link href="../css/style.css" rel="stylesheet">

    <style>
        #root .searchTerm {
            width: 100px
        }

        .ansdiv {
            margin: auto;
            width: 100%;
            display: block;
        }

        #root .ansbtn {
            width: 100px;
            background-color: #004E64;
        }

        #root .answerbox {
            margin: auto;
            width: 100%;
            display: block;
        }

        .fillinanswers {
            text-align: center;
            display: grid;
        }

        #root .box {
            justify-content: space-between;
            align-items: center;
            display: flex;
            border: 0;
            margin: 0;
        }

        #root .chapter {
            border: 1px solid black;
            border-radius: 10px;
            margin-bottom: 20px;
            margin-left: 10px;
            margin-right: 10px;
        }

        .title {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #root {
            visibility: hidden;
        }
    </style>
</head>

<body>
<header>
    <nav>
        <ul class="menu">
            <li><a href="../index.html">Quiz</a></li>
            <li><a href="./fillin.html">Fill in</a></li>
            <li style="float: right"><a href="./about.html">About Study Aid - SocialPsycho</a></li>
        </ul>
    </nav>
</header>

<div class="js-container container" style="height: 0;"></div>

<main>
    <p>Correct: <span id="correctnumbers"></span></p>
    <div id="root"></div>

    <button onclick="submit()">
        Submit
    </button>

    <br>
    <br>
    <br>
    <br>
    <br>

</main>

<footer>
    <p>Credits also go to: <a href="https://codepen.io/andershoff">Anders Hoff</a> for the Confetti and to
        <a
                href="https://www.google.com/search?q=psychology+perspectives+and+connections+4th+edition&oq=psychology+perspectives+and+connections+4th+edition&aqs=edge..69i57.207j0j1&sourceid=chrome&ie=UTF-8">Psychology:
            Perspectives and Connections 4th edition</a> for the Quiz questions
        inspiration.
    </p>
</footer>
<script type="text/babel">
    let questionsnumber = 0;
    let correctanswers = 0;

    let datajson = []
    let originaldatajson = [];

    const root = ReactDOM.createRoot(
        document.getElementById('root')
    );

    async function showData(datatoshow) {
        let elements = [];
        await datatoshow.forEach((datum, index) => {
            const element = (
                <section className="chapter" key={index}>
                    <div className="box">
                        <div className="title">
                            <h3>{datum.question}</h3>
                        </div>

                        <div className="fillinanswers" id={datum.id}>
                            {new Array(datum.amountofspaces).fill(null).map((value, indexOfDatum) => {
                                return (
                                    <div className="answerbox" id={"answerbox-" + datum.id} key={indexOfDatum}>
                                        <select defaultValue="default" className="searchTerm"
                                                id={"select-" + datum.id}
                                                name=""
                                                onSelect={() => storeValueSelected(indexOfDatum, datum.answers)}>
                                            <option value="default" disabled>select
                                            </option>
                                            {Object.keys(datum.answers).map((value) => {
                                                return (
                                                    <option value={value} key={value}>{datum.answers[value]}</option>
                                                )
                                            })}
                                        </select>
                                    </div>
                                );
                            })}

                            <div className="ansdiv">
                                <button id={"ansbtn-" + datum.id} onClick={() => checkAnswer(datum)}>Check</button>
                            </div>
                        </div>
                    </div>
                    <div className="texts">
                        <div id={"statushere-" + datum.id}>
                        </div>
                    </div>
                </section>
            );

            elements.push(element);
        });

        questionsnumber = datatoshow.length;
        correctanswers = 0;

        await root.render(elements);
        updateProgress(questionsnumber);
        await delay(300);
        document.getElementById('root').shuffleChildren();
        document.getElementById('root').querySelectorAll("select").forEach(el => el.shuffleChildrenOnlyEnabled(el));
        document.getElementById('root').style.visibility = "visible";
    }

    Element.prototype.shuffleChildrenOnlyEnabled = function (el) {
        for (let i = el.children.length; i >= 0; i--) {
            if (el.children[i] != null)
                el.appendChild(el.children[Math.random() * i | 1]);
        }
    };

    Element.prototype.shuffleChildren = function () {
        for (let i = this.children.length; i >= 0; i--) {
            this.appendChild(this.children[Math.random() * i | 0]);
        }
    };

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function getData() {
        return await fetch('../json/fillindata.json')
            .then(response => response.json())
            .then(data => data)
            .catch(error => console.log(error));
    }

    function disableCorrectAnswerBox(id) {
        console.dir("ansbtn-" + id);
        document.getElementById("ansbtn-" + id).disabled = true;
        const idofselect = "#select-" + id;
        document.querySelectorAll(idofselect).forEach(el => {
            el.disabled = true;
        })
    }

    function showMessage(isCorrect, id) {
        if (isCorrect) {
            document.getElementById("statushere-" + id).innerText = "✅ You got it right. Keep up the GREAT work buddy👍";
        } else {
            document.getElementById("statushere-" + id).innerText = "This is not the right answer but you are making progress buddy";
        }
    }

    async function init() {
        datajson = await getData();
        originaldatajson = datajson;
        await showData(datajson);
    }

    function checkIfCorrect(datum) {
        let isCorrect = true;
        const divcontainer = Array.from(document.getElementById(datum.id).children);

        // for each of the selects... check if all correct... else question is answered wrong
        console.dir(divcontainer);
        divcontainer.forEach((item, index) => {
            if (item.className === 'answerbox') {
                const valueSelected = datum.answers[item.childNodes[0].value];
                if (valueSelected !== datum.correct[index])
                    isCorrect = false;
            }
        });

        return isCorrect;
    }


    function cleanUpErrorsCorrects() {
        const nodestexts = document.getElementsByClassName("texts");

        for (let i = 0; i < nodestexts.length; i++) {
            nodestexts[i].childNodes.forEach(node => node.textContent = "");
        }

        const nodes = document.getElementsByClassName("ansbtn");

        for (let i = 0; i < nodes.length; i++) {
            nodes[i].disabled = false;
        }
    }

    async function showDataWithNoShuffle(datatoshow) {
        let elements = [];
        await datatoshow.forEach((datum, index) => {
            const element = (
                <section className="chapter" key={index}>
                    <div className="box">
                        <div className="title">
                            <h3>{datum.question}</h3>
                        </div>

                        <div className="fillinanswers" id={datum.id}>
                            {new Array(datum.amountofspaces).fill(null).map((value, indexOfDatum) => {
                                return (
                                    <div className="answerbox" id={"answerbox-" + datum.id} key={indexOfDatum}>
                                        <select defaultValue="default" className="searchTerm"
                                                id={"select-" + datum.id}
                                                name=""
                                                onSelect={() => storeValueSelected(indexOfDatum, datum.answers)}>
                                            <option value="default" disabled>select
                                            </option>
                                            {Object.keys(datum.answers).map((value) => {
                                                return (
                                                    <option value={value} key={value}>{datum.answers[value]}</option>
                                                )
                                            })}
                                        </select>
                                    </div>
                                );
                            })}

                            <div className="ansdiv">
                                <button id={"ansbtn-" + datum.id} onClick={() => checkAnswer(datum)}>Check</button>
                            </div>
                        </div>
                    </div>
                    <div className="texts">
                        <div id={"statushere-" + datum.id}>
                        </div>
                    </div>
                </section>
            );

            elements.push(element);
        });

        questionsnumber = datatoshow.length;
        correctanswers = 0;

        await root.render(elements);
        updateProgress(questionsnumber);
    }

    function updateProgress(questionsnumber) {
        document.getElementById("correctnumbers").innerText = correctanswers + " out of " + questionsnumber + " questions.";
    }

    function checkAnswer(datum) {
        if (checkIfCorrect(datum)) {
            disableCorrectAnswerBox(datum.id)
            correctanswers++;
            showMessage(true, datum.id);
        } else {
            showMessage(false, datum.id);
        }

        updateProgress(datajson.length);
    }

    init();

    function submit() {
        if (correctanswers === questionsnumber) {
            window.confettiful = new Confettiful(document.querySelector('.js-container'));
            alert("Mission accomplished 🎉🎉🍾🍾🍾🍾🎊🎊🎊");
        } else {
            alert("Mission failed");
        }
    }

    const Confettiful = function (el) {
        this.el = el;
        this.containerEl = null;
        this.confettiColors = ['#EF2964', '#00C09D', '#2D87B0', '#48485E', '#EFFF1D'];
        this.confettiAnimations = ['slow', 'medium', 'fast'];

        this._setupElements();
        this._renderConfetti();
    };

    Confettiful.prototype._setupElements = function () {
        const containerEl = document.createElement('div');
        const elPosition = this.el.style.position;

        this.el.style.position = 'fixed';

        containerEl.classList.add('confetti-container');
        const height = document.documentElement.scrollHeight;
        containerEl.style.height = height + "px";

        this.el.appendChild(containerEl);

        this.containerEl = containerEl;
    };

    Confettiful.prototype._renderConfetti = function () {
        this.confettiInterval = setInterval(() => {
            const confettiEl = document.createElement('div');
            const confettiSize = (Math.floor(Math.random() * 3) + 7) + 'px';
            const confettiBackground = this.confettiColors[Math.floor(Math.random() * this.confettiColors.length)];
            const confettiLeft = (Math.floor(Math.random() * this.el.offsetWidth)) + 'px';
            const confettiAnimation = this.confettiAnimations[Math.floor(Math.random() * this.confettiAnimations.length)];

            confettiEl.classList.add('confetti', 'confetti--animation-' + confettiAnimation);
            confettiEl.style.left = confettiLeft;
            confettiEl.style.width = confettiSize;
            confettiEl.style.height = confettiSize;
            confettiEl.style.backgroundColor = confettiBackground;

            confettiEl.removeTimeout = setTimeout(function () {
                confettiEl.parentNode.removeChild(confettiEl);
            }, 3000);

            this.containerEl.appendChild(confettiEl);
        }, 25);
    };

</script>
</body>

</html>
